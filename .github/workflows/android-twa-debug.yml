name: Rumo Android TWA - APK de homologacao

on:
  workflow_dispatch:
  push:
    branches:
      - feature/rumo-play-store-preparacao-20261022
    paths:
      - "android/**"
      - ".github/workflows/android-twa-debug.yml"
      - "public/icon-512.png"
      - "public/maskable-512.png"

permissions:
  contents: read

jobs:
  android-debug:
    name: Gerar APK de testes
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android API 36
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Instalar Bubblewrap 1.25
        shell: bash
        run: npm install --global @bubblewrap/cli@1.25.0

      - name: Preparar configuracao Android
        shell: bash
        run: |
          bubblewrap updateConfig --jdkPath="$JAVA_HOME" --androidSdkPath="$ANDROID_HOME"
          cd android
          bubblewrap update --skipVersionUpgrade

      - name: Verificar API 36
        shell: bash
        run: |
          grep -R -E "targetSdkVersion 36|targetSdk 36" android/app/build.gradle

      - name: Compilar APK de debug
        working-directory: android
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Guardar APK para teste no celular
        uses: actions/upload-artifact@v4
        with:
          name: rumo-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
