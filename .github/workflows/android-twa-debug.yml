name: Rumo Android TWA - APK de homologacao

on:
  pull_request:
    branches:
      - main
    paths:
      - "android/**"
      - "src/**"
      - "vercel.json"
      - "public/manifest.webmanifest"
      - ".github/workflows/android-twa-debug.yml"
  workflow_dispatch:
  push:
    branches:
      - feature/rumo-play-store-preparacao-20261022
    paths:
      - "android/**"
      - "src/**"
      - "vercel.json"
      - "public/manifest.webmanifest"
      - ".github/workflows/android-twa-debug.yml"
      - "public/icon-512.png"
      - "public/maskable-512.png"

permissions:
  contents: read

jobs:
  web-preview-build:
    name: Validar build web (sem publicar)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar interface do Rumo
        run: npm run build

  android-debug:
    name: Gerar APK de testes
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # O runner ubuntu-latest ja inclui Android SDK. Evitamos
      # setup-android@v3: ele tenta instalar "tools" (pacote removido).
      - name: Instalar Android API 36
        shell: bash
        run: |
          test -n "${ANDROID_HOME:-}" || { echo "Android SDK nao encontrado no runner"; exit 1; }
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$SDKMANAGER" || { echo "sdkmanager indisponivel"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Instalar Bubblewrap 1.25
        shell: bash
        run: npm install --global @bubblewrap/cli@1.25.0

      - name: Preparar configuracao Android
        shell: bash
        run: |
          # A configuracao inicial interativa impede builds automatizados.
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"
          cd android
          bubblewrap update --skipVersionUpgrade

      - name: Verificar API 36
        shell: bash
        run: |
          grep -R -E "targetSdkVersion 36|targetSdk 36" android/app/build.gradle

      - name: Compilar APK de debug
        working-directory: android
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Guardar APK para teste no celular
        uses: actions/upload-artifact@v4
        with:
          name: rumo-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
