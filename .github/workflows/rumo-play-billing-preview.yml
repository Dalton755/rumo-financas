name: RUMO Play Billing preview validation

on:
  pull_request:
    paths:
      - 'src/pages/Premium.jsx'
      - 'src/services/googlePlayBilling.js'
      - 'supabase/functions/rumo-play-verify/**'
      - 'docs/google-play-billing-schema.sql'
      - '.github/workflows/rumo-play-billing-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate frontend build
        run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck Play verification edge function
        run: deno check supabase/functions/rumo-play-verify/index.ts
