name: Rumo - preparar correcao de dependencias

on:
  pull_request:
    branches: [main]
    paths: ["package.json", "package-lock.json", ".github/workflows/rumo-deps-preview.yml"]
  workflow_dispatch:
  push:
    branches:
      - feature/rumo-play-store-preparacao-20261022
    paths:
      - ".github/workflows/rumo-deps-preview.yml"

permissions:
  contents: write

jobs:
  dependencias-seguras:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar dependencias atuais
        run: npm ci
      - name: Atualizar Vite corrigido e transitive vulneraveis
        run: |
          npm install --save-dev --save-exact vite@8.3.5
          npm audit fix || true
      - name: Garantir compatibilidade e build web
        run: npm run build
      - name: Confirmar ausencia de vulnerabilidades altas e criticas
        run: npm audit --audit-level=high
      - name: Aplicar somente na branch de homologacao
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/rumo-play-store-preparacao-20261022'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(security): atualizar dependencias auditadas do Rumo"
            git push origin HEAD:refs/heads/feature/rumo-play-store-preparacao-20261022
          fi
      - name: Preparar lockfile e dependencias para revisao
        uses: actions/upload-artifact@v4
        with:
          name: rumo-dependencias-corrigidas
          path: |
            package.json
            package-lock.json
          retention-days: 7
          if-no-files-found: error
