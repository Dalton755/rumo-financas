name: Dependency remediation

on:
  push:
    branches:
      - security-hardening-2026-09-21

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: security-hardening-2026-09-21

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply non-breaking audit fixes
        run: npm audit fix || true

      - name: Upgrade React Router to patched release
        run: npm install react-router-dom@7.18.4 --save-exact

      - name: Re-apply non-breaking audit fixes
        run: npm audit fix || true

      - name: Verify no high or critical vulnerabilities
        run: npm audit --audit-level=high

      - name: Commit dependency fixes
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: remediate npm advisories [deps-fix]"
          git push origin HEAD:security-hardening-2026-09-21
